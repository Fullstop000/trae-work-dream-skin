name: CLI CI

on:
  pull_request:
    paths:
      - "packages/cli/**"
      - "themes/**"
      - ".github/workflows/cli-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "themes/**"
      - ".github/workflows/cli-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run prepare:runtime
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
