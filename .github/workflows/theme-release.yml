name: Publish theme release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to build and update
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: packages/cli
      - name: Verify release tag matches package version
        run: test "${RELEASE_TAG#v}" = "$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
        working-directory: packages/cli
      - name: Build official theme pack
        run: npm run build:themes
        working-directory: packages/cli
      - name: Upload official theme pack to GitHub Release
        run: gh release upload "$RELEASE_TAG" dist/twskin-themes-"$RELEASE_TAG".tar.gz dist/twskin-themes-"$RELEASE_TAG".sha256 dist/twskin-themes.tar.gz dist/twskin-themes.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
