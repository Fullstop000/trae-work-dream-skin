name: Publish CLI to npm

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: macos-14
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: packages/cli
      - name: Verify release tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
        working-directory: packages/cli
      - name: Build official theme pack
        run: npm run build:themes
        working-directory: packages/cli
      - name: Upload official theme pack to GitHub Release
        run: gh release upload "$GITHUB_REF_NAME" dist/twskin-themes-"$GITHUB_REF_NAME".tar.gz dist/twskin-themes-"$GITHUB_REF_NAME".sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm publish --access public --provenance
        working-directory: packages/cli
