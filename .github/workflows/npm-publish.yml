name: Publish CLI to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish to npm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-14
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: packages/cli
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "${RELEASE_TAG#v}" = "$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
        working-directory: packages/cli
      - run: npm run build
        working-directory: packages/cli
      - run: npm publish --access public --provenance
        working-directory: packages/cli
